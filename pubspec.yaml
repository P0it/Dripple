name: dripple
description: "Multiplayer English word card battle game"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  flame: ^1.23.0
  go_router: ^14.8.1
  equatable: ^2.0.7
  dripple_rules:
    path: packages/dripple_rules
  uuid: ^4.5.1
  collection: ^1.19.1
  audioplayers: ^6.1.0
  vibration: ^2.0.0
  shared_preferences: ^2.3.0
  http: ^1.2.0

dev_dependencies:
  # The real server, so the client is tested against the thing it talks to
  # rather than against a mock that can quietly drift away from it.
  dripple_server:
    path: server
  # Only to stand that server up on a port in the client's tests.
  shelf: ^1.4.2
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4
  flame_test: ^2.3.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/sounds/
    - assets/music/
    - assets/fonts/

  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.ttf
          weight: 400
        - asset: assets/fonts/Pretendard-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.ttf
          weight: 700
    # The wordmark only. A variable cut, because the mark uses two of its axes
    # — weight, and the SOFT axis that rounds the terminals into something the
    # card stock agrees with. Licence beside it: assets/fonts/Fraunces-OFL.txt
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-Variable.ttf
